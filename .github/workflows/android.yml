name: Android Debug APK

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Web-Abhängigkeiten installieren
        run: npm ci
        working-directory: web
      - name: Web-PWA mit Android synchronisieren
        run: npm run android:sync
        working-directory: web
      - name: Native Unit-Tests ausführen
        run: ./gradlew testDebugUnitTest
        working-directory: web/android
      - name: Debug-APK bauen
        run: ./gradlew assembleDebug
        working-directory: web/android
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
